<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <defs>
    <clipPath id="screenA"><circle cx="250" cy="260" r="220"/></clipPath>
    <clipPath id="screenB"><circle cx="750" cy="260" r="220"/></clipPath>
    <clipPath id="screenC"><circle cx="1250" cy="260" r="220"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1500" height="560" fill="#f1f1ed"/>

  <text x="250" y="38" fill="#222222" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Normal launcher</text>
  <text x="750" y="38" fill="#222222" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Left half vertical swipe: Brightness</text>
  <text x="1250" y="38" fill="#222222" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Right half vertical swipe: Volume</text>

  <!-- Frame 1: normal launcher -->
  <circle cx="250" cy="260" r="226" fill="#d8d8d2"/>
  <g clip-path="url(#screenA)">
    <circle cx="250" cy="260" r="220" fill="#000000"/>
    <rect x="30" y="40" width="220" height="440" fill="#1a1a1a" opacity="0.45"/>
    <rect x="250" y="40" width="220" height="440" fill="#101010" opacity="0.45"/>
    <line x1="250" y1="52" x2="250" y2="468" stroke="#2d2d2d" stroke-width="3" stroke-dasharray="8 10"/>

    <path d="M190 72 C226 48 274 48 310 72" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <text x="250" y="80" fill="#a8a8a8" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">12:30</text>

    <path d="M70 260 L90 240 M70 260 L90 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75"/>
    <path d="M430 260 L410 240 M430 260 L410 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75"/>

    <circle cx="250" cy="232" r="82" fill="#121212" stroke="#303030" stroke-width="5"/>
    <path d="M250 162 L267 213 L320 213 L277 244 L294 296 L250 264 L206 296 L223 244 L180 213 L233 213 Z" fill="#4AD78C" filter="url(#glow)"/>
    <text x="250" y="415" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">Stopwatch</text>
    <circle cx="220" cy="455" r="5" fill="#ffffff" opacity="0.45"/>
    <circle cx="250" cy="455" r="8" fill="#ffffff"/>
    <circle cx="280" cy="455" r="5" fill="#ffffff" opacity="0.45"/>
  </g>
  <circle cx="250" cy="260" r="220" fill="none" stroke="#1b1b1b" stroke-width="3"/>
  <text x="140" y="515" fill="#333333" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">left controls brightness</text>
  <text x="360" y="515" fill="#333333" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">right controls volume</text>

  <!-- Frame 2: brightness overlay -->
  <circle cx="750" cy="260" r="226" fill="#d8d8d2"/>
  <g clip-path="url(#screenB)">
    <circle cx="750" cy="260" r="220" fill="#000000"/>
    <path d="M690 72 C726 48 774 48 810 72" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"/>
    <text x="750" y="80" fill="#a8a8a8" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">12:30</text>
    <path d="M570 260 L590 240 M570 260 L590 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/>
    <path d="M930 260 L910 240 M930 260 L910 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/>
    <circle cx="750" cy="232" r="78" fill="#090909" stroke="#242424" stroke-width="5" opacity="0.75"/>
    <path d="M750 166 L766 214 L816 214 L775 244 L791 292 L750 262 L709 292 L725 244 L684 214 L734 214 Z" fill="#3a3a3a"/>
    <text x="750" y="415" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" opacity="0.45">Stopwatch</text>

    <rect x="540" y="105" width="176" height="310" rx="62" fill="#111111" opacity="0.96"/>
    <rect x="566" y="170" width="20" height="178" rx="10" fill="#343434"/>
    <rect x="566" y="236" width="20" height="112" rx="10" fill="#4AD78C"/>
    <circle cx="576" cy="236" r="16" fill="#ffffff"/>
    <circle cx="678" cy="162" r="33" fill="#4AD78C"/>
    <path d="M678 142 L678 182 M658 162 L698 162" stroke="#0F5831" stroke-width="7" stroke-linecap="round"/>
    <text x="646" y="300" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="900" text-anchor="middle">74</text>
    <text x="646" y="333" fill="#bdbdbd" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">BRIGHT</text>
    <path d="M626 378 C596 344 596 196 626 162" stroke="#4AD78C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M620 156 L640 156 L630 137 Z" fill="#4AD78C"/>
    <path d="M620 384 L640 384 L630 403 Z" fill="#4AD78C" opacity="0.55"/>
  </g>
  <circle cx="750" cy="260" r="220" fill="none" stroke="#1b1b1b" stroke-width="3"/>
  <text x="750" y="515" fill="#333333" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">temporary overlay while dragging, release to persist</text>

  <!-- Frame 3: volume overlay -->
  <circle cx="1250" cy="260" r="226" fill="#d8d8d2"/>
  <g clip-path="url(#screenC)">
    <circle cx="1250" cy="260" r="220" fill="#000000"/>
    <path d="M1190 72 C1226 48 1274 48 1310 72" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"/>
    <text x="1250" y="80" fill="#a8a8a8" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">12:30</text>
    <path d="M1070 260 L1090 240 M1070 260 L1090 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/>
    <path d="M1430 260 L1410 240 M1430 260 L1410 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/>
    <circle cx="1250" cy="232" r="78" fill="#090909" stroke="#242424" stroke-width="5" opacity="0.75"/>
    <path d="M1250 166 L1266 214 L1316 214 L1275 244 L1291 292 L1250 262 L1209 292 L1225 244 L1184 214 L1234 214 Z" fill="#3a3a3a"/>
    <text x="1250" y="415" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" opacity="0.45">Stopwatch</text>

    <rect x="1284" y="105" width="176" height="310" rx="62" fill="#111111" opacity="0.96"/>
    <rect x="1414" y="170" width="20" height="178" rx="10" fill="#343434"/>
    <rect x="1414" y="276" width="20" height="72" rx="10" fill="#4AD78C"/>
    <circle cx="1424" cy="276" r="16" fill="#ffffff"/>
    <path d="M1324 152 L1352 152 L1382 126 L1382 198 L1352 172 L1324 172 Z" fill="#4AD78C"/>
    <path d="M1394 145 C1408 158 1408 166 1394 179" stroke="#0F5831" stroke-width="7" stroke-linecap="round" fill="none"/>
    <text x="1374" y="300" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="900" text-anchor="middle">42</text>
    <text x="1374" y="333" fill="#bdbdbd" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">VOLUME</text>
    <path d="M1374 378 C1404 344 1404 196 1374 162" stroke="#4AD78C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M1360 156 L1380 156 L1370 137 Z" fill="#4AD78C"/>
    <path d="M1360 384 L1380 384 L1370 403 Z" fill="#4AD78C" opacity="0.55"/>
  </g>
  <circle cx="1250" cy="260" r="220" fill="none" stroke="#1b1b1b" stroke-width="3"/>
  <text x="1250" y="515" fill="#333333" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">same style, right-side overlay for volume</text>
</svg>
