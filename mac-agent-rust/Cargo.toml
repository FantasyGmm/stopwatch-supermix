[package]
name = "stopwatch-codex-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
native-runtime = []

[[bin]]
name = "stopwatch-codex-agent"
path = "src/main.rs"
required-features = ["native-runtime"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
aes = "0.8"
ccm = "0.5"
base64 = "0.22"
btleplug = "0.13.5"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
rand = "0.8"
regex = "1"
rmp-serde = "=1.3.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
core-foundation = "0.10"
core-graphics = "0.25"
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
